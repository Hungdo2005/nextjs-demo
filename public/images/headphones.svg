<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="hp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#e0e7ff" opacity="0.6"/>
  <!-- Headband -->
  <path d="M 120 200 A 80 80 0 0 1 280 200" fill="none" stroke="#1e1b4b" stroke-width="20" stroke-linecap="round"/>
  <!-- Ear cups -->
  <rect x="95" y="180" width="36" height="70" rx="18" fill="url(#hp)"/>
  <rect x="269" y="180" width="36" height="70" rx="18" fill="url(#hp)"/>
  <!-- Inner pads -->
  <rect x="110" y="190" width="15" height="50" rx="7" fill="#6366f1"/>
  <rect x="275" y="190" width="15" height="50" rx="7" fill="#6366f1"/>
  <text x="200" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#4f46e5" text-anchor="middle">PRO HEADPHONES</text>
</svg>
