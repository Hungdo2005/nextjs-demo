<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg4)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#fce7f3" opacity="0.6"/>
  <!-- Monitor frame -->
  <rect x="65" y="100" width="270" height="150" rx="10" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <!-- Screen display -->
  <rect x="75" y="110" width="250" height="130" rx="6" fill="url(#screen)"/>
  <!-- Stand stem -->
  <rect x="185" y="250" width="30" height="40" fill="#475569"/>
  <!-- Stand base -->
  <path d="M 140 290 L 260 290 L 250 300 L 150 300 Z" fill="#334155"/>
  <text x="200" y="340" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ec4899" text-anchor="middle">ULTRA-WIDE 4K MONITOR</text>
</svg>
