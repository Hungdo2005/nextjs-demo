<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-laptop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screen-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="body-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-laptop)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#1e1b4b" opacity="0.6"/>
  
  <!-- Screen Lid -->
  <rect x="90" y="100" width="220" height="145" rx="10" fill="#0f172a" stroke="#475569" stroke-width="4"/>
  <rect x="98" y="108" width="204" height="128" rx="6" fill="url(#screen-grad)" opacity="0.9"/>
  <!-- Screen Wallpaper Element -->
  <path d="M 98 190 Q 150 140 200 170 T 302 160 L 302 236 L 98 236 Z" fill="#0ea5e9" opacity="0.4"/>
  <circle cx="200" cy="114" r="2.5" fill="#94a3b8"/>

  <!-- Base / Keyboard Body -->
  <path d="M 65 245 L 335 245 L 315 275 L 85 275 Z" fill="url(#body-grad)" stroke="#475569" stroke-width="3"/>
  <!-- Trackpad indent -->
  <rect x="170" y="258" width="60" height="12" rx="3" fill="#0f172a" opacity="0.8"/>
  <path d="M 180 245 L 220 245 L 218 249 L 182 249 Z" fill="#64748b"/>

  <text x="200" y="325" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">TITANIUM LAPTOP PRO</text>
</svg>
