<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="lens-outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <radialGradient id="lens-glass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#6366f1" />
      <stop offset="85%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" fill="url(#bg-cam)" rx="16"/>
  <circle cx="200" cy="195" r="130" fill="#312e81" opacity="0.4"/>

  <!-- Camera Body -->
  <rect x="95" y="125" width="210" height="135" rx="16" fill="#1e293b" stroke="#334155" stroke-width="3"/>

  <!-- Grip texture on right -->
  <rect x="260" y="135" width="38" height="115" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <line x1="268" y1="150" x2="290" y2="150" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="165" x2="290" y2="165" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="180" x2="290" y2="180" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="195" x2="290" y2="195" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="210" x2="290" y2="210" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  <line x1="268" y1="225" x2="290" y2="225" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <!-- Viewfinder hump -->
  <path d="M 160 125 L 175 102 L 225 102 L 240 125 Z" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="182" y="106" width="36" height="12" rx="3" fill="#0f172a"/>
  <!-- Hotshoe -->
  <rect x="187" y="98" width="26" height="4" rx="1" fill="#64748b"/>

  <!-- Mode Dial -->
  <rect x="115" y="115" width="30" height="10" rx="3" fill="#475569"/>
  <!-- Shutter Button -->
  <rect x="270" y="117" width="20" height="8" rx="2" fill="#cbd5e1"/>

  <!-- Red Recording / Sensor Accent Dot -->
  <circle cx="120" cy="142" r="4" fill="#ef4444"/>

  <!-- Large Central Lens Assembly -->
  <circle cx="185" cy="195" r="56" fill="url(#lens-outer)" stroke="#64748b" stroke-width="3"/>
  <circle cx="185" cy="195" r="48" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="185" cy="195" r="38" fill="url(#lens-glass)"/>
  <!-- Lens Flare Reflection -->
  <ellipse cx="172" cy="180" rx="12" ry="7" fill="#ffffff" opacity="0.35" transform="rotate(-25 172 180)"/>
  <circle cx="196" cy="206" r="4" fill="#38bdf8" opacity="0.6"/>

  <!-- Model Typography -->
  <text x="200" y="320" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">4K PRO MIRRORLESS</text>
</svg>
