<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-phone" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="phone-screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-phone)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#312e81" opacity="0.5"/>

  <!-- Phone Body -->
  <rect x="135" y="80" width="130" height="230" rx="26" fill="#020617" stroke="#475569" stroke-width="4"/>
  <!-- Phone Screen -->
  <rect x="141" y="86" width="118" height="218" rx="22" fill="url(#phone-screen)" opacity="0.9"/>
  <!-- Screen Glow Art -->
  <circle cx="200" cy="180" r="45" fill="#f43f5e" opacity="0.4"/>
  <circle cx="170" cy="210" r="35" fill="#38bdf8" opacity="0.5"/>
  <!-- Dynamic Island Notch -->
  <rect x="180" y="93" width="40" height="11" rx="5.5" fill="#020617"/>
  <circle cx="212" cy="98.5" r="2.5" fill="#1e293b"/>
  <!-- Home indicator line -->
  <rect x="175" y="295" width="50" height="4" rx="2" fill="#ffffff" opacity="0.8"/>

  <text x="200" y="345" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f472b6" text-anchor="middle" letter-spacing="2">FLAGSHIP 5G OLED</text>
</svg>
