<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-charger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="stand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glow-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" fill="url(#bg-charger)" rx="16"/>
  <circle cx="200" cy="190" r="130" fill="#0369a1" opacity="0.3"/>

  <!-- Base Station -->
  <ellipse cx="200" cy="255" rx="100" ry="24" fill="url(#stand-grad)" stroke="#475569" stroke-width="3"/>
  <!-- Base Earbuds Charging Pad indent -->
  <ellipse cx="200" cy="255" rx="35" ry="10" fill="#0f172a" stroke="#38bdf8" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- Metallic Angled Stem / Arm -->
  <path d="M 194 250 L 175 140 L 187 140 L 206 250 Z" fill="#64748b"/>
  <path d="M 196 250 L 225 155 L 235 155 L 206 250 Z" fill="#475569"/>

  <!-- MagSafe Phone Charging Pad (Main angled disc) -->
  <ellipse cx="160" cy="135" rx="46" ry="46" fill="#1e293b" stroke="#38bdf8" stroke-width="3"/>
  <ellipse cx="160" cy="135" rx="34" ry="34" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 3"/>
  <!-- Lightning / Wireless Icon on Phone Pad -->
  <path d="M 163 121 L 153 135 L 161 135 L 157 149 L 169 133 L 161 133 Z" fill="url(#glow-cyan)"/>

  <!-- Watch Charging Puck (Right side arm) -->
  <circle cx="240" cy="155" r="24" fill="#1e293b" stroke="#64748b" stroke-width="2.5"/>
  <circle cx="240" cy="155" r="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="240" cy="155" r="7" fill="#334155"/>

  <!-- LED Indicator Dot on Base -->
  <circle cx="200" cy="272" r="3.5" fill="#10b981"/>

  <!-- Model Typography -->
  <text x="200" y="325" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">3-IN-1 MAGNETIC CHARGING HUB</text>
</svg>
