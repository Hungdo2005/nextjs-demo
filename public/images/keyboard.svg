<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="kb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg2)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#ede9fe" opacity="0.6"/>
  <!-- Keyboard chassis -->
  <rect x="70" y="140" width="260" height="120" rx="14" fill="url(#kb)" stroke="#334155" stroke-width="4"/>
  <!-- Key rows -->
  <g fill="#475569">
    <rect x="85" y="155" width="20" height="15" rx="3" fill="#818cf8"/>
    <rect x="110" y="155" width="20" height="15" rx="3"/>
    <rect x="135" y="155" width="20" height="15" rx="3"/>
    <rect x="160" y="155" width="20" height="15" rx="3"/>
    <rect x="185" y="155" width="20" height="15" rx="3"/>
    <rect x="210" y="155" width="20" height="15" rx="3"/>
    <rect x="235" y="155" width="20" height="15" rx="3"/>
    <rect x="260" y="155" width="20" height="15" rx="3"/>
    <rect x="285" y="155" width="30" height="15" rx="3" fill="#a855f7"/>

    <rect x="85" y="177" width="25" height="15" rx="3"/>
    <rect x="115" y="177" width="20" height="15" rx="3"/>
    <rect x="140" y="177" width="20" height="15" rx="3" fill="#c084fc"/>
    <rect x="165" y="177" width="20" height="15" rx="3"/>
    <rect x="190" y="177" width="20" height="15" rx="3"/>
    <rect x="215" y="177" width="20" height="15" rx="3"/>
    <rect x="240" y="177" width="20" height="15" rx="3"/>
    <rect x="265" y="177" width="20" height="15" rx="3"/>
    <rect x="290" y="177" width="25" height="15" rx="3"/>

    <!-- Spacebar row -->
    <rect x="85" y="221" width="30" height="15" rx="3" fill="#818cf8"/>
    <rect x="120" y="221" width="160" height="15" rx="4" fill="#a855f7"/>
    <rect x="285" y="221" width="30" height="15" rx="3" fill="#818cf8"/>
  </g>
  <text x="200" y="320" font-family="sans-serif" font-size="14" font-weight="bold" fill="#7c3aed" text-anchor="middle">MECHANICAL KEYBOARD</text>
</svg>
