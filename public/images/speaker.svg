<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-spk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="spk-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#7c2d12" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg-spk)" rx="16"/>
  <circle cx="200" cy="200" r="140" fill="#431407" opacity="0.4"/>

  <!-- Cylinder Speaker -->
  <rect x="145" y="100" width="110" height="190" rx="35" fill="url(#spk-body)" stroke="#1e293b" stroke-width="4"/>
  <!-- Passive Radiator Rings -->
  <ellipse cx="200" cy="120" rx="36" ry="14" fill="#0f172a" stroke="#fdba74" stroke-width="2"/>
  <ellipse cx="200" cy="270" rx="36" ry="14" fill="#0f172a" stroke="#fdba74" stroke-width="2"/>
  <!-- Front Controls -->
  <circle cx="200" cy="180" r="6" fill="#ffffff" opacity="0.9"/>
  <path d="M 197 176 L 204 180 L 197 184 Z" fill="#0f172a"/>
  <!-- Volume buttons -->
  <rect x="195" y="150" width="10" height="3" rx="1.5" fill="#ffffff"/>
  <rect x="198.5" y="146.5" width="3" height="10" rx="1.5" fill="#ffffff"/>
  <rect x="195" y="210" width="10" height="3" rx="1.5" fill="#ffffff"/>

  <text x="200" y="340" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#fb923c" text-anchor="middle" letter-spacing="2">360° HI-FI SPEAKER</text>
</svg>
